name: Tests and image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# If any permission is listed, every unlisted one becomes "none" -- so
# contents: read is required for the checkout and packages: write to push.
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the test suite
        run: python -m unittest discover

      # A runner is minutes old, so time.monotonic() is small there and large on
      # a developer's machine. This runs the same suite with the clock shifted to
      # look like a fresh boot, which is the difference that made a push fail
      # while every test passed locally.
      - name: Run the test suite on a freshly booted clock
        run: python tests/run_as_freshly_booted.py

      - name: Check the page script parses
        run: node --check static/script.js

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Emulation for arm64, so a Raspberry Pi or an ARM home server can pull
      # this too. Registration of the binfmt handlers is all buildx needs.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          # github.repository is "owner/name", and metadata-action lowercases it,
          # which image names require and account names do not always satisfy.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # The attestation manifests show up in registries as an extra
          # "unknown/unknown" platform entry, which confuses `docker manifest`
          # and a few UIs. Nothing here needs them.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
